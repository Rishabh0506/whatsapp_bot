<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footwear Bot Simulator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Footwear bot <span class="tag">WhatsApp simulator</span></div>
  <div class="who">
    <label>User number <input id="waId" value="919999999999" inputmode="numeric"></label>
    <label>Name <input id="name" value="Test user"></label>
    <button id="newUser" title="Start a chat as a new user">New user</button>
  </div>
  <div id="info" class="info"></div>
</header>

<main class="layout">
  <section class="phone" aria-label="Chat">
    <div class="chat-head">
      <div class="avatar">FH</div>
      <div><div class="chat-title">Footwear Helpline</div><div class="chat-sub">test mode</div></div>
    </div>
    <div id="thread" class="thread"></div>
    <div id="pending" class="pending" hidden></div>
    <form id="composer" class="composer">
      <label class="attach" title="Attach photos">
        <input id="photos" type="file" accept="image/*" multiple hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M16.5 6.5v10.6a4.5 4.5 0 0 1-9 0V5.6a3 3 0 0 1 6 0v10.3a1.5 1.5 0 0 1-3 0V6.5H9v9.4a3 3 0 0 0 6 0V5.6a4.5 4.5 0 0 0-9 0v11.5a6 6 0 0 0 12 0V6.5z"/></svg>
      </label>
      <input id="text" placeholder="Message or photo caption" autocomplete="off">
      <button id="send" type="submit" title="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
  </section>

  <section class="debug" aria-label="Debug panel">
    <div class="debug-head">
      <h2>Diagnoses</h2>
      <span class="hint">What the bot decided internally. Consumers never see this panel.</span>
    </div>
    <div id="diagnoses" class="diagnoses"><p class="empty">Send a photo to see the 10 fields here.</p></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
